    <text x="697" y="225" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">7</text>
    <circle cx="722" cy="222" r="10" fill="#2BA5A8"/>
    <text x="722" y="226" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">8</text>
    <text x="747" y="225" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">9</text>
    <text x="772" y="225" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">10</text>
    <text x="797" y="225" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">11</text>
