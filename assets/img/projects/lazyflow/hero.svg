  <rect x="630" y="150" width="400" height="300" rx="16" fill="url(#ipadFrame)" stroke="#4b5563" stroke-width="2"/>
  <!-- Camera -->
  <circle cx="830" cy="160" r="4" fill="#1f2937"/>

  <!-- iPad screen -->
  <g clip-path="url(#ipadScreen)">
    <rect x="650" y="165" width="360" height="270" fill="#1F2121"/>

    <!-- Split view: Calendar on left, Tasks on right -->

    <!-- Left panel: Calendar week view -->
    <rect x="650" y="165" width="180" height="270" fill="#1a1a1e"/>

    <!-- Calendar header -->
    <rect x="650" y="165" width="180" height="30" fill="#2C2C2E"/>
    <text x="740" y="185" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">January 2026</text>

    <!-- Day columns -->
    <text x="672" y="210" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">Mon</text>
    <text x="697" y="210" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">Tue</text>
    <text x="722" y="210" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#2BA5A8" text-anchor="middle">Wed</text>
