    <text x="395" y="472" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#2BA5A8" text-anchor="middle">Today</text>

    <!-- Tab: Calendar -->
    <rect x="437" y="451" width="10" height="8" rx="1.5" fill="none" stroke="#6b7280" stroke-width="1"/>
    <line x1="437" y1="454" x2="447" y2="454" stroke="#6b7280" stroke-width="1"/>
    <text x="442" y="472" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Calendar</text>

    <!-- Tab: Lists -->
    <line x1="480" y1="452" x2="490" y2="452" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="480" y1="457" x2="490" y2="457" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="480" y1="462" x2="487" y2="462" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <text x="485" y="472" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Lists</text>

    <!-- Home indicator -->
    <rect x="425" y="478" width="50" height="4" rx="2" fill="#48484A"/>
