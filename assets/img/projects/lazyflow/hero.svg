    <text x="422" y="298" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#FF9500">Due today</text>

    <!-- AI Recommendation -->
    <rect x="372" y="318" width="156" height="52" rx="8" fill="url(#aiCard)" stroke="#2BA5A8" stroke-width="1"/>
    <text x="384" y="336" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#2BA5A8" font-weight="500">What should I do next?</text>
    <text x="384" y="350" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#ffffff">Write unit tests</text>
    <text x="384" y="363" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280">High priority, 45 min available</text>

    <!-- Sparkle icon -->
