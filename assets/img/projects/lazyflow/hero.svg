    <rect x="10" y="6" width="10" height="8" rx="1" fill="none" stroke="#2BA5A8" stroke-width="1.5"/>
    <text x="40" y="14" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#e0e0e0">Widgets &amp; Live Activities</text>
