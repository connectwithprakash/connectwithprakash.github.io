<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BA5A8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#218A8D;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ipadFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calendarEvent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2BA5A8;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#218A8D;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="iphoneScreen">
      <rect x="365" y="115" width="170" height="370" rx="20"/>
    </clipPath>
    <clipPath id="ipadScreen">
      <rect x="650" y="165" width="360" height="270" rx="8"/>
    </clipPath>
    <clipPath id="watchScreen">
      <rect x="165" y="245" width="90" height="110" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="url(#bgGrad)"/>

  <!-- Decorative glow circles (sized proportional to devices) -->
  <circle cx="210" cy="300" r="100" fill="#2BA5A8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="450" cy="300" r="220" fill="#2BA5A8" opacity="0.06" filter="url(#glow)"/>
  <circle cx="830" cy="300" r="250" fill="#218A8D" opacity="0.06" filter="url(#glow)"/>

  <!-- Title -->
  <text x="600" y="50" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="600">Lazyflow</text>
  <text x="600" y="78" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Calendar-first task management across all your Apple devices</text>

  <!-- ==================== APPLE WATCH (Left) ==================== -->
  <!-- Watch body -->
  <rect x="150" y="220" width="120" height="160" rx="30" fill="url(#phoneFrame)" stroke="#4b5563" stroke-width="2"/>
  <!-- Watch crown -->
  <rect x="270" y="280" width="8" height="30" rx="3" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <!-- Watch button -->
  <circle cx="274" cy="340" r="6" fill="#374151" stroke="#4b5563" stroke-width="1"/>

  <!-- Watch screen -->
  <g clip-path="url(#watchScreen)">
    <rect x="165" y="245" width="90" height="110" fill="#1F2121"/>

    <!-- Watch time -->
    <text x="210" y="265" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#2BA5A8" text-anchor="middle" font-weight="600">10:23</text>
    <text x="210" y="278" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Today</text>

    <!-- Watch tasks -->
    <rect x="172" y="285" width="76" height="18" rx="4" fill="#2C2C2E"/>
    <circle cx="182" cy="294" r="5" fill="none" stroke="#2BA5A8" stroke-width="1.5"/>
    <text x="192" y="297" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#ffffff">Write tests</text>

    <rect x="172" y="308" width="76" height="18" rx="4" fill="#2C2C2E"/>
    <circle cx="182" cy="317" r="5" fill="none" stroke="#34C759" stroke-width="1.5"/>
    <path d="M179 317 L181 319 L186 314" stroke="#34C759" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="192" y="320" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-decoration="line-through">Review PR</text>

    <rect x="172" y="331" width="76" height="18" rx="4" fill="#2C2C2E"/>
    <circle cx="182" cy="340" r="5" fill="none" stroke="#48484A" stroke-width="1"/>
    <text x="192" y="343" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#ffffff">Update docs</text>
  </g>

  <!-- Watch label -->
  <text x="210" y="400" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Apple Watch</text>

  <!-- ==================== iPHONE (Center) ==================== -->
  <!-- iPhone frame -->
  <rect x="350" y="100" width="200" height="400" rx="28" fill="url(#phoneFrame)" stroke="#4b5563" stroke-width="2"/>

  <!-- Dynamic Island -->
  <rect x="405" y="112" width="90" height="28" rx="14" fill="#000000"/>
  <circle cx="430" cy="126" r="5" fill="#1a1a2a"/>
  <circle cx="470" cy="126" r="8" fill="#0a0a15"/>

  <!-- iPhone screen -->
  <g clip-path="url(#iphoneScreen)">
    <rect x="365" y="115" width="170" height="370" fill="#1F2121"/>

    <!-- Status bar -->
    <text x="375" y="135" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff">9:41</text>
    <text x="525" y="135" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">100%</text>

    <!-- App header -->
    <rect x="365" y="145" width="170" height="40" fill="#2C2C2E"/>
    <text x="378" y="172" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Today</text>
    <text x="522" y="168" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#2BA5A8" text-anchor="end">Jan 8</text>

    <!-- Time labels -->
    <text x="372" y="205" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">9 AM</text>
    <text x="372" y="260" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">10 AM</text>
    <text x="372" y="315" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">11 AM</text>

    <!-- Calendar event -->
    <rect x="398" y="192" width="130" height="38" rx="6" fill="url(#calendarEvent)"/>
    <text x="406" y="208" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="500">Team Standup</text>
    <text x="406" y="222" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">9:00 - 9:30 AM</text>

    <!-- Task 1 (completed) -->
    <rect x="398" y="238" width="130" height="30" rx="6" fill="#2C2C2E"/>
    <circle cx="410" cy="253" r="7" fill="none" stroke="#34C759" stroke-width="1.5"/>
    <path d="M406 253 L409 256 L414 250" stroke="#34C759" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="422" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-decoration="line-through">Review PR #247</text>
    <text x="422" y="262" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#48484A">30m</text>

