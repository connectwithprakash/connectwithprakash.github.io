    <rect x="739" y="260" width="16" height="50" rx="3" fill="#f59e0b" opacity="0.9"/>
    <rect x="764" y="250" width="16" height="30" rx="3" fill="url(#calendarEvent)" opacity="0.9"/>

    <!-- Time blocks (tasks scheduled) -->
