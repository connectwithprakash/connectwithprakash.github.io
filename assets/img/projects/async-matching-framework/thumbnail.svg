<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 405">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="405" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="425" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="600">Async Matching Framework</text>

  <!-- Input: SPD -->
  <rect x="95" y="120" width="110" height="130" rx="8" fill="url(#inputGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="150" font-family="SF Mono, monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">INPUT</text>
  <text x="150" y="175" font-family="SF Pro Display, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Low Confidence</text>
  <text x="150" y="192" font-family="SF Pro Display, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">SPD</text>
  <text x="150" y="220" font-family="SF Mono, monospace" font-size="9" fill="#6b7280" text-anchor="middle">"ORG MLK 2%"</text>

  <!-- Arrow 1 -->
  <path d="M210 185 L240 185" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Agents Container -->
  <rect x="245" y="55" width="345" height="275" rx="12" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="417" y="78" font-family="SF Pro Display, sans-serif" font-size="11" fill="#6366f1" text-anchor="middle">AGENT PIPELINE</text>

  <!-- Agent 1: Canonical Brand -->
  <rect x="265" y="95" width="85" height="90" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="307" y="118" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 1</text>
  <text x="307" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Canonical</text>
  <text x="307" y="152" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Brand</text>
  <text x="307" y="173" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">"Organic Valley"</text>

  <!-- Arrow 2 -->
  <path d="M355 140 L370 140" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 2: Fetch Brand -->
  <rect x="375" y="95" width="85" height="90" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="417" y="118" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 2</text>
  <text x="417" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Fetch</text>
  <text x="417" y="152" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Brand</text>
  <text x="417" y="173" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">ID: 12847</text>

  <!-- Arrow 3 -->
  <path d="M465 140 L480 140" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 3: Category -->
  <rect x="485" y="95" width="85" height="90" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="527" y="118" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 3</text>
  <text x="527" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Category</text>
  <text x="527" y="152" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Agent</text>
  <text x="527" y="173" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">Food > Dairy</text>

  <!-- Arrow down to Guardrail -->
  <path d="M417 190 L417 210" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 4: Guardrail -->
  <rect x="330" y="215" width="175" height="60" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="417" y="238" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">GUARDRAIL AGENT</text>
  <text x="417" y="255" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Validates coherence + error patterns</text>
  <text x="417" y="270" font-family="SF Mono, monospace" font-size="9" fill="#10b981" text-anchor="middle">PASSED</text>

  <!-- Retrievers (bottom) -->
  <rect x="265" y="285" width="305" height="40" rx="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <text x="417" y="302" font-family="SF Mono, monospace" font-size="9" fill="#6366f1" text-anchor="middle">RETRIEVERS (RRF Hybrid)</text>
  <text x="417" y="317" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Brand | SPD | Abbreviations | Error History | Web Search</text>

  <!-- Dotted lines to retrievers -->
  <path d="M307 185 L307 285" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M417 275 L417 285" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M527 185 L527 285" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Arrow from pipeline to output -->
  <path d="M590 185 L620 185" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Output -->
  <rect x="635" y="110" width="120" height="150" rx="8" fill="url(#outputGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="695" y="135" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">OUTPUT</text>

  <text x="695" y="158" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Brand</text>
  <text x="695" y="173" font-family="SF Mono, monospace" font-size="11" fill="#e0e0e0" text-anchor="middle">Organic Valley</text>

  <text x="695" y="195" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Category</text>
  <text x="695" y="210" font-family="SF Mono, monospace" font-size="11" fill="#e0e0e0" text-anchor="middle">Food > Dairy</text>

  <text x="695" y="232" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Confidence</text>
  <text x="695" y="247" font-family="SF Mono, monospace" font-size="11" fill="#10b981" text-anchor="middle">97%</text>

  <!-- Stats bar -->
  <rect x="127" y="345" width="580" height="35" rx="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <text x="200" y="367" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">$165M GMV</text>
  <text x="345" y="367" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">15K+ mappings</text>
  <text x="490" y="367" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">88% accuracy</text>
  <text x="635" y="367" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">15% full automation</text>

</svg>
