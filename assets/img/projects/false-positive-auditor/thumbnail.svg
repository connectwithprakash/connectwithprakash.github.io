<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="blacklistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="380" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="425" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="600">False Positive Auditor</text>

  <!-- Input: Match -->
  <rect x="40" y="130" width="100" height="90" rx="8" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="90" y="160" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="600">INPUT</text>
  <text x="90" y="180" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">PAM-ML</text>
  <text x="90" y="195" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Match</text>

  <!-- Arrow to workflow -->
  <path d="M140 175 L180 175" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 3-Agent Workflow Container -->
  <rect x="190" y="100" width="280" height="150" rx="8" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="330" y="122" font-family="SF Mono, monospace" font-size="9" fill="#6366f1" text-anchor="middle">3-AGENT WORKFLOW (reused)</text>

  <!-- Agent 1 -->
  <rect x="205" y="140" width="70" height="50" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="240" y="162" font-family="SF Mono, monospace" font-size="7" fill="#a78bfa" text-anchor="middle">AGENT 1</text>
  <text x="240" y="178" font-family="SF Pro Display, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Normalize</text>

  <!-- Arrow 1->2 -->
  <path d="M275 165 L290 165" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 2 -->
  <rect x="295" y="140" width="70" height="50" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="330" y="162" font-family="SF Mono, monospace" font-size="7" fill="#a78bfa" text-anchor="middle">AGENT 2</text>
  <text x="330" y="178" font-family="SF Pro Display, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Brand</text>

  <!-- Arrow 2->3 -->
  <path d="M365 165 L380 165" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 3 -->
  <rect x="385" y="140" width="70" height="50" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="162" font-family="SF Mono, monospace" font-size="7" fill="#a78bfa" text-anchor="middle">AGENT 3</text>
  <text x="420" y="178" font-family="SF Pro Display, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Classify</text>

  <!-- Label output -->
  <text x="330" y="215" font-family="SF Mono, monospace" font-size="9" fill="#6b7280" text-anchor="middle">Label: 0-4</text>

  <!-- Arrow to decision -->
  <path d="M470 175 L520 175" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Decision Diamond -->
  <polygon points="530,175 580,130 630,175 580,220" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="580" y="170" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Label?</text>
  <text x="580" y="185" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa" text-anchor="middle">0-1 / 2-4</text>

  <!-- Valid path (2-4) - from top -->
  <path d="M580 130 L580 90 L680 90" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="620" y="82" font-family="SF Mono, monospace" font-size="9" fill="#10b981" text-anchor="middle">2-4</text>

  <!-- Valid Match box -->
  <rect x="690" y="55" width="110" height="70" rx="8" fill="url(#validGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="745" y="82" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">VALID</text>
  <text x="745" y="100" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Match OK</text>
  <text x="745" y="115" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">No action</text>

  <!-- Blacklist path (0-1) - from bottom -->
  <path d="M580 220 L580 260 L680 260" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="620" y="248" font-family="SF Mono, monospace" font-size="9" fill="#ef4444" text-anchor="middle">0-1</text>

  <!-- Blacklist box -->
  <rect x="690" y="225" width="110" height="70" rx="8" fill="url(#blacklistGrad)" stroke="#ef4444" stroke-width="2"/>
  <text x="745" y="252" font-family="SF Mono, monospace" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="600">BLACKLIST</text>
  <text x="745" y="270" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">False Positive</text>
  <text x="745" y="285" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Block repeat</text>

  <!-- Stats bar -->
  <rect x="150" y="320" width="550" height="35" rx="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <text x="260" y="342" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">95% Recall</text>
  <text x="425" y="342" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">$800K GMV Protected</text>
  <text x="590" y="342" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">8hr to 15min</text>

</svg>
