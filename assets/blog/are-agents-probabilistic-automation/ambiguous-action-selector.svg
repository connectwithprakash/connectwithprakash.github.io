<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img">
  <defs>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#252538"/>
      <stop offset="100%" stop-color="#343456"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#818cf8"/>
    </marker>
    <style>
      .bg { fill: #111827; stroke: rgba(129,140,248,.35); stroke-width: 1; }
      .box { fill: url(#node); stroke: #818cf8; stroke-width: 1.5; rx: 16; }
      .safe { stroke: #22c55e; }
      .risk { stroke: #f59e0b; }
      .danger { stroke: #ef4444; }
      .decision { fill: #1f2937; stroke: #a78bfa; stroke-width: 1.5; }
      .title { fill: #f8fafc; font: 700 23px Inter, ui-sans-serif, system-ui, sans-serif; }
      .text { fill: #e2e8f0; font: 600 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #cbd5e1; font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #94a3b8; font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .line { stroke: #818cf8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-safe { stroke: #22c55e; }
      .line-risk { stroke: #f59e0b; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="898" height="558" rx="22"/>
<text class="title" x="450" y="42" text-anchor="middle">Ambiguous chat response as an action selector</text>
<rect class="box " x="260" y="72" width="380" height="72" rx="16"/>
<text class="text" x="450.0" y="106" text-anchor="middle">Agent asks: inspect first,</text>
<text class="text" x="450.0" y="129" text-anchor="middle">or close directly?</text>
<path class="line" d="M450 144 L450 182"/>
<rect class="box decision" x="335" y="186" width="230" height="62" rx="16"/>
<text class="text" x="450.0" y="228" text-anchor="middle">User says: yes</text>
<path class="line" d="M450 248 L450 286"/>
<rect class="box decision" x="310" y="290" width="280" height="72" rx="16"/>
<text class="text" x="450.0" y="324" text-anchor="middle">What does yes</text>
<text class="text" x="450.0" y="347" text-anchor="middle">attach to?</text>
<rect class="box safe" x="55" y="425" width="190" height="88" rx="16"/>
<text class="text" x="150.0" y="467" text-anchor="middle">Inspect first</text>
<text class="muted" x="150.0" y="495" text-anchor="middle">mostly read-only</text>
<rect class="box danger" x="255" y="425" width="190" height="88" rx="16"/>
<text class="text" x="350.0" y="467" text-anchor="middle">Close directly</text>
<text class="muted" x="350.0" y="495" text-anchor="middle">side effect</text>
<rect class="box safe" x="455" y="425" width="190" height="88" rx="16"/>
<text class="text" x="550.0" y="459" text-anchor="middle">Ask for</text>
<text class="text" x="550.0" y="482" text-anchor="middle">clarification</text>
<text class="muted" x="550.0" y="495" text-anchor="middle">pause</text>
<rect class="box risk" x="655" y="425" width="190" height="88" rx="16"/>
<text class="text" x="750.0" y="459" text-anchor="middle">Explain ambiguity,</text>
<text class="text" x="750.0" y="482" text-anchor="middle">then choose</text>
<text class="muted" x="750.0" y="495" text-anchor="middle">inference</text>
<path class="line" d="M450 362 C450 390 150 390 150 425"/>
<path class="line" d="M450 362 C450 390 350 390 350 425"/>
<path class="line" d="M450 362 C450 390 550 390 550 425"/>
<path class="line" d="M450 362 C450 390 750 390 750 425"/>
</svg>