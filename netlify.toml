[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/projects/robocon/"
  to = "/project/abu-robocon-2018"
  status = 301

[[redirects]]
  from = "/projects/robocon"
  to = "/project/abu-robocon-2018"
  status = 301

# Known routes have generated HTML; unknown URLs must not become soft 404s.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
