<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chatBubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chatBubbleAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="productCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="100" y="25" width="200" height="365" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="60" r="80" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="350" cy="390" r="100" fill="#10b981" opacity="0.06"/>

  <!-- iPhone Frame -->
  <rect x="90" y="15" width="220" height="410" rx="32" fill="url(#phoneFrame)" stroke="#4a4a5a" stroke-width="2"/>

  <!-- iPhone Screen -->
  <rect x="100" y="25" width="200" height="365" rx="22" fill="#000000"/>

  <!-- Dynamic Island -->
  <rect x="165" y="32" width="70" height="22" rx="11" fill="#000000" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="185" cy="43" r="4" fill="#1a1a2a"/>
  <circle cx="215" cy="43" r="6" fill="#0a0a15"/>

  <!-- Screen Content (clipped) -->
  <g clip-path="url(#screenClip)">
    <!-- App Background -->
    <rect x="100" y="25" width="200" height="365" fill="#0f172a"/>

    <!-- Status Bar -->
    <text x="112" y="48" font-family="SF Pro Display, sans-serif" font-size="9" fill="#ffffff">9:41</text>
    <text x="288" y="48" font-family="SF Pro Display, sans-serif" font-size="9" fill="#ffffff" text-anchor="end">100%</text>

    <!-- App Header -->
    <rect x="100" y="60" width="200" height="40" fill="#1e293b"/>
    <text x="200" y="86" font-family="SF Pro Display, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Calvin</text>

    <!-- User Message -->
    <rect x="135" y="110" width="155" height="34" rx="17" fill="url(#chatBubbleUser)"/>
    <text x="212" y="132" font-family="SF Pro Display, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Create a $50 pantry list</text>

    <!-- AI Response -->
    <rect x="108" y="154" width="184" height="115" rx="12" fill="url(#chatBubbleAI)" stroke="#334155" stroke-width="1"/>
    <text x="120" y="174" font-family="SF Pro Display, sans-serif" font-size="9" fill="#10b981">Here's your list:</text>
    <text x="120" y="192" font-family="SF Mono, monospace" font-size="8" fill="#e0e0e0">• Rice — 5 lb</text>
    <text x="120" y="208" font-family="SF Mono, monospace" font-size="8" fill="#e0e0e0">• Pasta — 2 packs</text>
    <text x="120" y="224" font-family="SF Mono, monospace" font-size="8" fill="#e0e0e0">• Canned beans — 4</text>
    <text x="120" y="240" font-family="SF Mono, monospace" font-size="8" fill="#e0e0e0">• Eggs — 1 dozen</text>
    <text x="120" y="256" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">+ 9 more items</text>

    <!-- Product Cards Preview -->
    <rect x="108" y="278" width="55" height="68" rx="6" fill="url(#productCard)" stroke="#10b981" stroke-width="1"/>
    <rect x="116" y="286" width="39" height="26" rx="3" fill="#1e293b"/>
    <text x="135" y="326" font-family="SF Mono, monospace" font-size="7" fill="#fbbf24" text-anchor="middle">900 pts</text>
    <text x="135" y="339" font-family="SF Pro Display, sans-serif" font-size="6" fill="#e0e0e0" text-anchor="middle">Cereal</text>

    <rect x="172" y="278" width="55" height="68" rx="6" fill="url(#productCard)" stroke="#10b981" stroke-width="1"/>
    <rect x="180" y="286" width="39" height="26" rx="3" fill="#1e293b"/>
    <text x="199" y="326" font-family="SF Mono, monospace" font-size="7" fill="#fbbf24" text-anchor="middle">400 pts</text>
    <text x="199" y="339" font-family="SF Pro Display, sans-serif" font-size="6" fill="#e0e0e0" text-anchor="middle">Baking</text>

    <rect x="236" y="278" width="55" height="68" rx="6" fill="url(#productCard)" stroke="#10b981" stroke-width="1"/>
    <rect x="244" y="286" width="39" height="26" rx="3" fill="#1e293b"/>
    <text x="263" y="326" font-family="SF Mono, monospace" font-size="7" fill="#fbbf24" text-anchor="middle">1K pts</text>
    <text x="263" y="339" font-family="SF Pro Display, sans-serif" font-size="6" fill="#e0e0e0" text-anchor="middle">Sauce</text>

    <!-- Input Bar -->
    <rect x="108" y="355" width="184" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="122" y="373" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280">Ask anything...</text>
    <circle cx="275" cy="369" r="9" fill="#8b5cf6"/>
  </g>

  <!-- Home Indicator -->
  <rect x="170" y="398" width="60" height="4" rx="2" fill="#475569"/>
</svg>