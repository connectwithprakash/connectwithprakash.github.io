<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#a78bfa" text-anchor="middle" font-weight="600">AI Shopping Assistant Architecture</text>
  <text x="450" y="55" font-family="SF Pro Display, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Multi-Agent ReAct System</text>

  <!-- User Input -->
  <rect x="30" y="180" width="120" height="100" rx="12" fill="#1e293b" stroke="#6b7280" stroke-width="2"/>
  <circle cx="90" cy="198" r="12" fill="#6366f1" opacity="0.3"/>
  <text x="90" y="202" font-family="SF Pro Display, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle">👤</text>
  <text x="90" y="228" font-family="SF Pro Display, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle" font-weight="600">User Query</text>
  <text x="90" y="248" font-family="SF Mono, monospace" font-size="8" fill="#6b7280" text-anchor="middle">"Build me a</text>
  <text x="90" y="261" font-family="SF Mono, monospace" font-size="8" fill="#6b7280" text-anchor="middle">$50 pantry list"</text>

  <!-- Arrow to Orchestrator -->
  <path d="M155 230 L195 230" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- Main Orchestrator Agent -->
  <rect x="200" y="130" width="200" height="240" rx="12" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="155" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="600">ORCHESTRATOR AGENT</text>

  <!-- ReAct Loop -->
  <rect x="220" y="175" width="160" height="175" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="195" font-family="SF Mono, monospace" font-size="9" fill="#6366f1" text-anchor="middle">ReAct Loop</text>

  <!-- Thought -->
  <rect x="235" y="210" width="130" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="223" font-family="SF Mono, monospace" font-size="8" fill="#f59e0b" text-anchor="middle">THOUGHT</text>
  <text x="300" y="238" font-family="SF Pro Display, sans-serif" font-size="8" fill="#e0e0e0" text-anchor="middle">Need product offers...</text>

  <!-- Action -->
  <rect x="235" y="255" width="130" height="35" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="300" y="268" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">ACTION</text>
  <text x="300" y="283" font-family="SF Pro Display, sans-serif" font-size="8" fill="#e0e0e0" text-anchor="middle">Invoke MCP tool</text>

  <!-- Observation -->
  <rect x="235" y="300" width="130" height="35" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="300" y="313" font-family="SF Mono, monospace" font-size="8" fill="#8b5cf6" text-anchor="middle">OBSERVATION</text>
  <text x="300" y="328" font-family="SF Pro Display, sans-serif" font-size="8" fill="#e0e0e0" text-anchor="middle">Found 14 offers...</text>

  <!-- Loop arrow -->
  <path d="M370 270 Q390 270 390 250 Q390 230 370 230" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>

  <!-- Arrow to LLM -->
  <path d="M405 250 L445 250" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- LLM Engine -->
  <rect x="450" y="175" width="140" height="150" rx="12" fill="url(#llmGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="200" font-family="SF Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="600">LLM ENGINE</text>

  <rect x="465" y="215" width="110" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="520" y="232" font-family="SF Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="middle">Text Model</text>

  <rect x="465" y="250" width="110" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="520" y="267" font-family="SF Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="middle">Vision Model</text>

  <rect x="465" y="285" width="110" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="520" y="302" font-family="SF Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="middle">Fast Model</text>

  <!-- Arrow to MCP Tools -->
  <path d="M595 250 L635 250" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- MCP Tools Container -->
  <rect x="640" y="80" width="230" height="340" rx="12" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="755" y="105" font-family="SF Mono, monospace" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">MCP TOOLS</text>

  <!-- Tool 1: Offers Search -->
  <rect x="660" y="125" width="190" height="50" rx="8" fill="url(#toolGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="755" y="147" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">Offer Search</text>
  <text x="755" y="165" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Product offers and rewards</text>

  <!-- Tool 2: Product Info -->
  <rect x="660" y="185" width="190" height="50" rx="8" fill="url(#toolGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="755" y="207" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">Product Info</text>
  <text x="755" y="225" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Nutrition, price, details</text>

  <!-- Tool 3: Store Locator -->
  <rect x="660" y="245" width="190" height="50" rx="8" fill="url(#toolGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="755" y="267" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">Store Locator</text>
  <text x="755" y="285" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Nearby stores and hours</text>

  <!-- Tool 4: Receipt Scanner -->
  <rect x="660" y="305" width="190" height="50" rx="8" fill="url(#toolGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="755" y="327" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">Purchase History</text>
  <text x="755" y="345" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Past purchases and patterns</text>

  <!-- Tool 5: Image Analysis -->
  <rect x="660" y="365" width="190" height="50" rx="8" fill="url(#toolGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="755" y="387" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">Image Analysis</text>
  <text x="755" y="405" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Fridge scan, product ID</text>

  <!-- Response Path -->
  <path d="M300 375 L300 430 L90 430 L90 305" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" stroke-dasharray="8,4"/>
  <text x="195" y="445" font-family="SF Mono, monospace" font-size="9" fill="#6b7280" text-anchor="middle">Response Stream</text>

  <!-- Output -->
  <rect x="30" y="310" width="120" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="90" y="335" font-family="SF Pro Display, sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">Response</text>
  <text x="90" y="355" font-family="SF Mono, monospace" font-size="7" fill="#e0e0e0" text-anchor="middle">14 items list</text>
  <text x="90" y="368" font-family="SF Mono, monospace" font-size="7" fill="#e0e0e0" text-anchor="middle">+ offer cards</text>
  <text x="90" y="381" font-family="SF Mono, monospace" font-size="7" fill="#e0e0e0" text-anchor="middle">+ follow-ups</text>

  <!-- Infrastructure Bar -->
  <rect x="50" y="475" width="800" height="55" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <text x="450" y="495" font-family="SF Mono, monospace" font-size="10" fill="#6366f1" text-anchor="middle">INFRASTRUCTURE</text>

  <text x="150" y="518" font-family="SF Pro Display, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">AWS Lambda</text>
  <text x="300" y="518" font-family="SF Pro Display, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">DynamoDB</text>
  <text x="450" y="518" font-family="SF Pro Display, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">OpenSearch</text>
  <text x="600" y="518" font-family="SF Pro Display, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">CloudWatch</text>
  <text x="750" y="518" font-family="SF Pro Display, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">Opik</text>

  <!-- Dividers -->
  <line x1="225" y1="505" x2="225" y2="525" stroke="#475569" stroke-width="1"/>
  <line x1="375" y1="505" x2="375" y2="525" stroke="#475569" stroke-width="1"/>
  <line x1="525" y1="505" x2="525" y2="525" stroke="#475569" stroke-width="1"/>
  <line x1="675" y1="505" x2="675" y2="525" stroke="#475569" stroke-width="1"/>
</svg>