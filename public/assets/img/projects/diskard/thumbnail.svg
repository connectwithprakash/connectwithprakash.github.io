<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d2d44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d3d5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gaugeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="40" cy="50" r="70" fill="#4facfe" opacity="0.04"/>
  <circle cx="360" cy="400" r="90" fill="#00f2fe" opacity="0.04"/>

  <!-- Terminal window -->
  <rect x="20" y="20" width="360" height="410" rx="12" fill="#0d1117" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Terminal header -->
  <rect x="20" y="20" width="360" height="36" rx="12" fill="url(#headerBg)"/>
  <rect x="20" y="44" width="360" height="12" fill="url(#headerBg)"/>

  <!-- Window buttons -->
  <circle cx="42" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="38" r="6" fill="#27ca3f"/>

  <!-- Terminal title -->
  <text x="200" y="43" font-family="SF Mono, Monaco, Consolas, monospace" font-size="12" fill="#a0a0a0" text-anchor="middle">diskard -i</text>

  <!-- Disk Usage Header -->
  <rect x="32" y="68" width="336" height="44" rx="6" fill="#161b22"/>
  <text x="44" y="84" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#8b949e">Disk Usage</text>
  <text x="356" y="84" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#8b949e" text-anchor="end">186.2 / 460.4 GB</text>

  <!-- Gauge background -->
  <rect x="44" y="92" width="312" height="10" rx="5" fill="url(#gaugeBg)"/>
  <!-- Gauge fill (40%) -->
  <rect x="44" y="92" width="126" height="10" rx="5" fill="url(#gaugeGrad)"/>

  <!-- Scan Results Header -->
  <text x="44" y="132" font-family="SF Mono, Monaco, Consolas, monospace" font-size="11" fill="#4facfe" font-weight="bold">Scan Results</text>
  <text x="356" y="132" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#8b949e" text-anchor="end">18.7 GB reclaimable</text>

  <!-- Separator -->
  <line x1="32" y1="140" x2="368" y2="140" stroke="#21262d" stroke-width="1"/>

  <!-- Result 1 - Selected (highlighted) -->
  <rect x="32" y="146" width="336" height="36" rx="4" fill="#1c2333" stroke="#4facfe" stroke-width="0.5"/>
  <rect x="44" y="155" width="14" height="14" rx="3" fill="#4facfe"/>
  <path d="M48 162 L50.5 165 L55 159" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="164" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Xcode DerivedData</text>
  <text x="356" y="160" font-family="SF Mono, Monaco, Consolas, monospace" font-size="9" fill="#4facfe" text-anchor="end">6.2 GB</text>
  <rect x="250" y="170" width="106" height="4" rx="2" fill="#21262d"/>
  <rect x="250" y="170" width="70" height="4" rx="2" fill="#4facfe" opacity="0.6"/>

  <!-- Result 2 -->
  <rect x="32" y="186" width="336" height="36" rx="4" fill="#0d1117"/>
  <rect x="44" y="195" width="14" height="14" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="68" y="204" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">node_modules</text>
  <text x="356" y="200" font-family="SF Mono, Monaco, Consolas, monospace" font-size="9" fill="#00f2fe" text-anchor="end">4.1 GB</text>
  <rect x="250" y="210" width="106" height="4" rx="2" fill="#21262d"/>
  <rect x="250" y="210" width="46" height="4" rx="2" fill="#00f2fe" opacity="0.6"/>

  <!-- Result 3 -->
  <rect x="32" y="226" width="336" height="36" rx="4" fill="#0d1117"/>
  <rect x="44" y="235" width="14" height="14" rx="3" fill="#4facfe"/>
  <path d="M48 242 L50.5 245 L55 239" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="244" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Homebrew Cache</text>
  <text x="356" y="240" font-family="SF Mono, Monaco, Consolas, monospace" font-size="9" fill="#27ca3f" text-anchor="end">2.8 GB</text>
  <rect x="250" y="250" width="106" height="4" rx="2" fill="#21262d"/>
  <rect x="250" y="250" width="31" height="4" rx="2" fill="#27ca3f" opacity="0.6"/>

  <!-- Result 4 -->
  <rect x="32" y="266" width="336" height="36" rx="4" fill="#0d1117"/>
  <rect x="44" y="275" width="14" height="14" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="68" y="284" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Ollama Models</text>
  <text x="356" y="280" font-family="SF Mono, Monaco, Consolas, monospace" font-size="9" fill="#fbbf24" text-anchor="end">2.3 GB</text>
  <rect x="250" y="290" width="106" height="4" rx="2" fill="#21262d"/>
  <rect x="250" y="290" width="26" height="4" rx="2" fill="#fbbf24" opacity="0.6"/>

  <!-- Result 5 -->
  <rect x="32" y="306" width="336" height="36" rx="4" fill="#0d1117"/>
  <rect x="44" y="315" width="14" height="14" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="68" y="324" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Rust target/</text>
  <text x="356" y="320" font-family="SF Mono, Monaco, Consolas, monospace" font-size="9" fill="#a78bfa" text-anchor="end">1.9 GB</text>
  <rect x="250" y="330" width="106" height="4" rx="2" fill="#21262d"/>
  <rect x="250" y="330" width="21" height="4" rx="2" fill="#a78bfa" opacity="0.6"/>

  <!-- Result 6 -->
  <rect x="32" y="346" width="336" height="36" rx="4" fill="#0d1117"/>
  <rect x="44" y="355" width="14" height="14" rx="3" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="68" y="364" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Docker Images</text>
  <text x="356" y="360" font-family="SF Mono, Monaco, Consolas, monospace" font-size="9" fill="#f97583" text-anchor="end">1.4 GB</text>
  <rect x="250" y="370" width="106" height="4" rx="2" fill="#21262d"/>
  <rect x="250" y="370" width="16" height="4" rx="2" fill="#f97583" opacity="0.6"/>

  <!-- Bottom status bar -->
  <rect x="32" y="390" width="336" height="28" rx="6" fill="#161b22"/>
  <text x="44" y="408" font-family="SF Mono, Monaco, Consolas, monospace" font-size="8" fill="#4facfe">2 selected</text>
  <text x="200" y="408" font-family="SF Mono, Monaco, Consolas, monospace" font-size="8" fill="#8b949e" text-anchor="middle">Enter: clean | q: quit</text>
  <text x="356" y="408" font-family="SF Mono, Monaco, Consolas, monospace" font-size="8" fill="#27ca3f" text-anchor="end">9.0 GB</text>

  <!-- Subtle app name -->
  <text x="200" y="442" font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#4facfe" opacity="0.3" text-anchor="middle" letter-spacing="3">DISKARD</text>
</svg>
