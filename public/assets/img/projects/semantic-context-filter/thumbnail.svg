<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#0f172a"/>

  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle">Semantic Context Filter</text>

  <!-- Left: Conversation History (multiple messages) -->
  <g id="messages">
    <!-- Message 1 - will be filtered out (dim) -->
    <rect x="30" y="70" width="100" height="35" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" opacity="0.5"/>
    <line x1="40" y1="82" x2="110" y2="82" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="92" x2="90" y2="92" stroke="#64748b" stroke-width="2" opacity="0.5"/>

    <!-- Message 2 - relevant (bright) -->
    <rect x="30" y="115" width="100" height="35" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="6"/>
    <line x1="40" y1="127" x2="110" y2="127" stroke="#10b981" stroke-width="2"/>
    <line x1="40" y1="137" x2="95" y2="137" stroke="#10b981" stroke-width="2"/>

    <!-- Message 3 - will be filtered out (dim) -->
    <rect x="30" y="160" width="100" height="35" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" opacity="0.5"/>
    <line x1="40" y1="172" x2="105" y2="172" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="182" x2="85" y2="182" stroke="#64748b" stroke-width="2" opacity="0.5"/>

    <!-- Message 4 - relevant (bright) -->
    <rect x="30" y="205" width="100" height="35" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="6"/>
    <line x1="40" y1="217" x2="115" y2="217" stroke="#10b981" stroke-width="2"/>
    <line x1="40" y1="227" x2="100" y2="227" stroke="#10b981" stroke-width="2"/>

    <!-- Message 5 - will be filtered out (dim) -->
    <rect x="30" y="250" width="100" height="35" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" opacity="0.5"/>
    <line x1="40" y1="262" x2="100" y2="262" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="272" x2="80" y2="272" stroke="#64748b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Center: Semantic Filter -->
  <g id="filter">
    <!-- Filter funnel shape -->
    <path d="M 160 100 L 240 100 L 220 180 L 180 180 Z" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Similarity scores inside filter -->
    <text x="200" y="125" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle">0.23</text>
    <text x="200" y="145" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">0.89</text>
    <text x="200" y="165" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle">0.31</text>

    <!-- Vector similarity icon -->
    <circle cx="200" cy="220" r="30" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="200" y="215" font-family="monospace" font-size="9" fill="#a78bfa" text-anchor="middle">cosine</text>
    <text x="200" y="228" font-family="monospace" font-size="9" fill="#a78bfa" text-anchor="middle">sim</text>

    <!-- Threshold line -->
    <line x1="155" y1="260" x2="245" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="200" y="275" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">threshold: 0.7</text>
  </g>

  <!-- Right: Filtered Output (only relevant) -->
  <g id="output">
    <!-- LLM box -->
    <rect x="270" y="130" width="100" height="80" fill="#1e293b" stroke="#6366f1" stroke-width="2" rx="8"/>
    <text x="320" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle">LLM</text>
    <text x="320" y="180" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Relevant</text>
    <text x="320" y="195" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Context Only</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Arrow from messages to filter -->
  <line x1="135" y1="170" x2="155" y2="150" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow from filter to LLM -->
  <line x1="245" y1="170" x2="265" y2="170" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stats at bottom -->
  <g id="stats">
    <rect x="50" y="320" width="130" height="50" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/>
    <text x="115" y="342" font-family="Arial, sans-serif" font-size="11" fill="#f87171" text-anchor="middle">Before: 100% tokens</text>
    <text x="115" y="358" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Full history</text>

    <rect x="220" y="320" width="130" height="50" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="285" y="342" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">After: 58% tokens</text>
    <text x="285" y="358" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">42% cost savings</text>
  </g>
</svg>
