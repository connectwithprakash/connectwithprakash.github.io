<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="session-bridge: three agent harness windows connected through a shared IR core">
  <defs>
    <radialGradient id="blobTL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fee140" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#fee140" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fee140" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background -->
  <clipPath id="card"><rect x="0" y="0" width="800" height="500" rx="16"/></clipPath>
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#111118"/>
  <g clip-path="url(#card)">
  <circle cx="60" cy="40" r="240" fill="url(#blobTL)"/>
  <circle cx="760" cy="480" r="260" fill="url(#blobBR)"/>
  </g>

  <!-- bridge paths (ochre = IR/bridge identity) -->
  <g stroke="#b08c22" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M300 222 C 335 226, 352 230, 366 233" opacity="0.85"/>
    <path d="M438 218 C 468 196, 492 162, 518 134" opacity="0.85"/>
    <path d="M438 252 C 468 274, 492 308, 518 336" opacity="0.85"/>
    <g filter="url(#soft)" opacity="0.5">
      <path d="M300 222 C 335 226, 352 230, 366 233"/>
      <path d="M438 218 C 468 196, 492 162, 518 134"/>
      <path d="M438 252 C 468 274, 492 308, 518 336"/>
    </g>
  </g>
  <!-- session-flow particles -->
  <g fill="#b08c22" opacity="0.7">
    <circle cx="318" cy="224" r="2.4"/>
    <circle cx="344" cy="229" r="2.4"/>
    <circle cx="460" cy="201" r="2.4"/>
    <circle cx="490" cy="167" r="2.4"/>
    <circle cx="460" cy="269" r="2.4"/>
    <circle cx="490" cy="303" r="2.4"/>
  </g>

  <!-- IR core -->
  <g>
    <circle cx="402" cy="235" r="86" fill="url(#coreGlow)"/>
    <circle cx="402" cy="235" r="36" fill="#111118" fill-opacity="0.6" stroke="#b08c22" stroke-width="2.5"/>
    <circle cx="402" cy="235" r="45" fill="none" stroke="#b08c22" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 6"/>
    <text x="402" y="241" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e8e8f0">IR</text>
    <text x="402" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9aa0ae">shared intermediate representation</text>
  </g>

  <!-- Claude Code window (left) -->
  <g>
    <rect x="66" y="150" width="234" height="142" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="66" y="150" width="234" height="3" rx="1.5" fill="#17a2b8"/>
    <circle cx="86" cy="172" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="100" cy="172" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="114" cy="172" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="86" y="196" width="12" height="12" rx="3" fill="#17a2b8"/>
    <text x="106" y="207" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e8e8f0">Claude Code</text>
    <rect x="86" y="228" width="150" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="86" y="244" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="86" y="260" width="132" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
  </g>

  <!-- Codex window (right-top) -->
  <g>
    <rect x="522" y="62" width="218" height="128" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="522" y="62" width="218" height="3" rx="1.5" fill="#3aa85f"/>
    <circle cx="542" cy="84" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="556" cy="84" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="570" cy="84" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="542" y="106" width="12" height="12" rx="3" fill="#3aa85f"/>
    <text x="562" y="117" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e8e8f0">Codex</text>
    <rect x="542" y="138" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="542" y="154" width="102" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
  </g>

  <!-- Hermes window (right-bottom) -->
  <g>
    <rect x="522" y="308" width="218" height="128" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="522" y="308" width="218" height="3" rx="1.5" fill="#8f6ae0"/>
    <circle cx="542" cy="330" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="556" cy="330" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="570" cy="330" r="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="542" y="352" width="12" height="12" rx="3" fill="#8f6ae0"/>
    <text x="562" y="363" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e8e8f0">Hermes</text>
    <rect x="542" y="384" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="542" y="400" width="102" height="6" rx="3" fill="#ffffff" fill-opacity="0.09"/>
  </g>

  <!-- title lockup -->
  <g>
    <text x="66" y="428" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="600" fill="#e8e8f0">session-bridge</text>
    <text x="66" y="454" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9aa0ae">resume any agent session, anywhere</text>
  </g>
</svg>
