<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="A stopped Claude Code session flows through session-bridge and resumes in Codex or Hermes">
  <defs>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOchre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fee140" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fee140" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa0ae"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="560" rx="16" fill="#111118"/>
  <ellipse cx="185" cy="255" rx="230" ry="180" fill="url(#glowCyan)"/>
  <ellipse cx="500" cy="270" rx="240" ry="200" fill="url(#glowOchre)"/>

  <!-- beat captions -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9aa0ae" text-anchor="middle" letter-spacing="1">
    <text x="185" y="96">1 · SESSION STOPS</text>
    <text x="500" y="96">2 · THE BRIDGE</text>
    <text x="815" y="96">3 · RESUMES ELSEWHERE</text>
  </g>

  <!-- Beat 1: Claude Code card -->
  <g>
    <rect x="70" y="195" width="230" height="130" rx="14" fill="#17a2b8" fill-opacity="0.28" stroke="#17a2b8" stroke-width="2"/>
    <!-- terminal glyph -->
    <rect x="96" y="238" width="44" height="34" rx="7" fill="none" stroke="#17a2b8" stroke-width="2"/>
    <path d="M104,248 L112,255 L104,262" fill="none" stroke="#17a2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="117" y1="263" x2="130" y2="263" stroke="#17a2b8" stroke-width="2" stroke-linecap="round"/>
    <text x="156" y="262" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e8e8f0">Claude Code</text>
    <!-- pause badge (state, not error) -->
    <circle cx="292" cy="203" r="15" fill="#23232d" stroke="#9aa0ae" stroke-width="1.5"/>
    <rect x="286" y="196" width="4" height="14" rx="1.5" fill="#9aa0ae"/>
    <rect x="294" y="196" width="4" height="14" rx="1.5" fill="#9aa0ae"/>
    <text x="185" y="355" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9aa0ae" text-anchor="middle">usage limit hit mid-task</text>
  </g>

  <!-- Beat 2: the bridge pill -->
  <g>
    <rect x="400" y="180" width="200" height="180" rx="34" fill="#b08c22" fill-opacity="0.30" stroke="#b08c22" stroke-width="2"/>
    <text x="500" y="216" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e8e8f0" text-anchor="middle">session-bridge</text>
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e8e8f0" text-anchor="middle">
      <rect x="428" y="232" width="144" height="28" rx="14" fill="#b08c22" fill-opacity="0.25" stroke="#b08c22" stroke-width="1"/>
      <text x="500" y="251">convert</text>
      <rect x="428" y="268" width="144" height="28" rx="14" fill="#b08c22" fill-opacity="0.25" stroke="#b08c22" stroke-width="1"/>
      <text x="500" y="287">handshake</text>
      <rect x="428" y="304" width="144" height="28" rx="14" fill="#b08c22" fill-opacity="0.25" stroke="#b08c22" stroke-width="1"/>
      <text x="500" y="323">register</text>
    </g>
  </g>

  <!-- Beat 3: Codex card -->
  <g>
    <rect x="700" y="118" width="230" height="92" rx="14" fill="#3aa85f" fill-opacity="0.28" stroke="#3aa85f" stroke-width="2"/>
    <circle cx="742" cy="164" r="16" fill="none" stroke="#3aa85f" stroke-width="2"/>
    <path d="M737,156 L750,164 L737,172 Z" fill="#3aa85f"/>
    <text x="772" y="171" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e8e8f0">Codex</text>
    <text x="815" y="236" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#9aa0ae" text-anchor="middle">codex resume &lt;id&gt;</text>
  </g>

  <!-- Beat 3: Hermes card -->
  <g>
    <rect x="700" y="316" width="230" height="92" rx="14" fill="#8f6ae0" fill-opacity="0.28" stroke="#8f6ae0" stroke-width="2"/>
    <circle cx="742" cy="362" r="16" fill="none" stroke="#8f6ae0" stroke-width="2"/>
    <path d="M737,354 L750,362 L737,370 Z" fill="#8f6ae0"/>
    <text x="772" y="369" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e8e8f0">Hermes</text>
    <text x="815" y="434" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#9aa0ae" text-anchor="middle">hermes --resume &lt;id&gt;</text>
  </g>

  <!-- dashed arcs -->
  <g fill="none" stroke="#9aa0ae" stroke-width="2" stroke-dasharray="6 6">
    <path d="M304,260 C340,258 358,266 392,269" marker-end="url(#arrow)"/>
    <path d="M604,232 C650,224 656,180 692,166" marker-end="url(#arrow)"/>
    <path d="M604,308 C650,316 656,350 692,362" marker-end="url(#arrow)"/>
  </g>

  <!-- sparkle motion marks -->
  <g stroke="#9aa0ae" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M348,246 v10 M343,251 h10"/>
    <path d="M652,190 v10 M647,195 h10"/>
    <path d="M652,336 v10 M647,341 h10"/>
  </g>

  <!-- legend -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9aa0ae">
    <circle cx="292" cy="507" r="5" fill="#17a2b8"/>
    <text x="304" y="512">Claude Code</text>
    <circle cx="422" cy="507" r="5" fill="#3aa85f"/>
    <text x="434" y="512">Codex</text>
    <circle cx="514" cy="507" r="5" fill="#8f6ae0"/>
    <text x="526" y="512">Hermes</text>
    <circle cx="616" cy="507" r="5" fill="#b08c22"/>
    <text x="628" y="512">session-bridge</text>
  </g>
</svg>
