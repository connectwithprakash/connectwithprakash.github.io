<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="420" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="375" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="600">Async Matching Framework</text>

  <!-- Input: SPD -->
  <rect x="30" y="120" width="110" height="130" rx="8" fill="url(#inputGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="85" y="150" font-family="SF Mono, monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">INPUT</text>
  <text x="85" y="175" font-family="SF Pro Display, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Low Confidence</text>
  <text x="85" y="192" font-family="SF Pro Display, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">SPD</text>
  <text x="85" y="220" font-family="SF Mono, monospace" font-size="9" fill="#6b7280" text-anchor="middle">"ORG MLK 2%"</text>

  <!-- Arrow 1 -->
  <path d="M145 185 L175 185" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Agents Container -->
  <rect x="180" y="55" width="345" height="300" rx="12" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="352" y="78" font-family="SF Pro Display, sans-serif" font-size="11" fill="#6366f1" text-anchor="middle">AGENT PIPELINE</text>

  <!-- Agent 1: Canonical Brand -->
  <rect x="200" y="95" width="85" height="90" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="242" y="118" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 1</text>
  <text x="242" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Canonical</text>
  <text x="242" y="152" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Brand</text>
  <text x="242" y="173" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">"Organic Valley"</text>

  <!-- Arrow 2 -->
  <path d="M290 140 L305 140" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 2: Fetch Brand -->
  <rect x="310" y="95" width="85" height="90" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="352" y="118" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 2</text>
  <text x="352" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Fetch</text>
  <text x="352" y="152" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Brand</text>
  <text x="352" y="173" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">ID: 12847</text>

  <!-- Arrow 3 -->
  <path d="M400 140 L415 140" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 3: Category -->
  <rect x="420" y="95" width="85" height="90" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="462" y="118" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 3</text>
  <text x="462" y="138" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Category</text>
  <text x="462" y="152" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Agent</text>
  <text x="462" y="173" font-family="SF Mono, monospace" font-size="8" fill="#10b981" text-anchor="middle">Food > Dairy</text>

  <!-- Arrow down to Guardrail -->
  <path d="M352 190 L352 210" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 4: Guardrail -->
  <rect x="265" y="215" width="175" height="60" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="352" y="238" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">GUARDRAIL AGENT</text>
  <text x="352" y="255" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Validates coherence + error patterns</text>
  <text x="352" y="270" font-family="SF Mono, monospace" font-size="9" fill="#10b981" text-anchor="middle">PASSED</text>

  <!-- Retrievers (bottom) -->
  <rect x="200" y="295" width="305" height="45" rx="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <text x="352" y="313" font-family="SF Mono, monospace" font-size="9" fill="#6366f1" text-anchor="middle">RETRIEVERS (RRF Hybrid)</text>
  <text x="352" y="330" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Brand | SPD | Abbreviations | Error History | Web Search</text>

  <!-- Dotted lines to retrievers -->
  <path d="M242 185 L242 295" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M352 275 L352 295" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M462 185 L462 295" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Arrow from pipeline to output -->
  <path d="M525 185 L555 185" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Output -->
  <rect x="570" y="110" width="150" height="150" rx="8" fill="url(#outputGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="645" y="135" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">OUTPUT</text>

  <text x="645" y="158" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Brand</text>
  <text x="645" y="173" font-family="SF Mono, monospace" font-size="11" fill="#e0e0e0" text-anchor="middle">Organic Valley</text>

  <text x="645" y="195" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Category</text>
  <text x="645" y="210" font-family="SF Mono, monospace" font-size="11" fill="#e0e0e0" text-anchor="middle">Food > Dairy</text>

  <text x="645" y="232" font-family="SF Pro Display, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Confidence</text>
  <text x="645" y="247" font-family="SF Mono, monospace" font-size="11" fill="#10b981" text-anchor="middle">97%</text>

  <!-- Stats bar -->
  <rect x="30" y="370" width="690" height="35" rx="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <text x="115" y="392" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">$165M GMV</text>
  <text x="290" y="392" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">15K+ mappings</text>
  <text x="460" y="392" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">88% accuracy</text>
  <text x="635" y="392" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">15% full automation</text>

</svg>
