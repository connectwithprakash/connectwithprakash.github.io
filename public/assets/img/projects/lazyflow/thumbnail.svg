<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BA5A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#218A8D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calendarEvent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0A84FF;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2BA5A8;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#218A8D;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="liveActivity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2BA5A8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#218A8D;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="watchFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a3a;stop-opacity:1" />
    </linearGradient>
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="100" y="25" width="200" height="365" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="60" r="80" fill="#2BA5A8" opacity="0.06"/>
  <circle cx="350" cy="390" r="100" fill="#218A8D" opacity="0.06"/>

  <!-- Subtle app name in background -->
  <text x="200" y="438" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#2BA5A8" opacity="0.4" text-anchor="middle" font-weight="600" letter-spacing="2">LAZYFLOW</text>

  <!-- Apple Watch (small, on the side) -->
  <g transform="translate(32, 180)">
    <!-- Watch body -->
    <rect x="0" y="0" width="42" height="50" rx="10" fill="url(#watchFrame)" stroke="#5a5a6a" stroke-width="1"/>
    <!-- Watch screen -->
    <rect x="4" y="5" width="34" height="40" rx="6" fill="#000000"/>
    <!-- Watch content -->
    <text x="21" y="18" font-family="SF Pro Display, -apple-system, sans-serif" font-size="6" fill="#ffffff" text-anchor="middle" font-weight="500">Today</text>
    <circle cx="12" cy="28" r="4" fill="none" stroke="#2BA5A8" stroke-width="1"/>
    <text x="20" y="30" font-family="SF Pro Display, -apple-system, sans-serif" font-size="5" fill="#ffffff">Task 1</text>
    <circle cx="12" cy="38" r="4" fill="none" stroke="#34C759" stroke-width="1"/>
    <path d="M10 38 L11.5 39.5 L14 37" stroke="#34C759" stroke-width="1" fill="none"/>
    <text x="20" y="40" font-family="SF Pro Display, -apple-system, sans-serif" font-size="5" fill="#6b7280">Done</text>
    <!-- Watch crown -->
    <rect x="42" y="18" width="4" height="14" rx="2" fill="#4a4a5a"/>
  </g>

  <!-- iPhone Frame -->
  <rect x="90" y="15" width="220" height="410" rx="32" fill="url(#phoneFrame)" stroke="#4a4a5a" stroke-width="2"/>

  <!-- iPhone Screen -->
  <rect x="100" y="25" width="200" height="365" rx="22" fill="#000000"/>

  <!-- Dynamic Island with Live Activity -->
  <rect x="155" y="32" width="90" height="24" rx="12" fill="url(#liveActivity)" stroke="#2BA5A8" stroke-width="0.5"/>
  <!-- Live Activity content -->
  <circle cx="170" cy="44" r="6" fill="none" stroke="#2BA5A8" stroke-width="1.5"/>
  <path d="M170 40 L170 44 L172 44" stroke="#2BA5A8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="182" y="42" font-family="SF Pro Display, -apple-system, sans-serif" font-size="6" fill="#ffffff">Working on</text>
  <text x="182" y="50" font-family="SF Pro Display, -apple-system, sans-serif" font-size="6" fill="#2BA5A8" font-weight="500">Unit tests</text>

  <!-- Screen Content (clipped) -->
  <g clip-path="url(#screenClip)">
    <!-- App Background -->
    <rect x="100" y="25" width="200" height="365" fill="#1F2121"/>

    <!-- Status Bar -->
    <text x="112" y="48" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#ffffff">9:41</text>
    <text x="288" y="48" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="end">100%</text>

    <!-- App Header -->
    <rect x="100" y="60" width="200" height="42" fill="#2C2C2E"/>
    <text x="115" y="86" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#ffffff" font-weight="600">Today</text>
    <text x="285" y="81" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#2BA5A8" text-anchor="end">Jan 8</text>

    <!-- Time labels -->
    <text x="108" y="118" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">9 AM</text>
    <text x="108" y="168" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">10 AM</text>
    <text x="108" y="218" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">11 AM</text>
    <text x="108" y="268" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">12 PM</text>

    <!-- Calendar Event Block -->
    <rect x="135" y="105" width="155" height="40" rx="6" fill="url(#calendarEvent)"/>
    <text x="143" y="121" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="500">Team Standup</text>
    <text x="143" y="136" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">9:00 - 9:30 AM</text>

    <!-- Task 1 (completed) -->
    <rect x="135" y="152" width="155" height="32" rx="6" fill="#2C2C2E"/>
    <circle cx="148" cy="168" r="8" fill="none" stroke="#34C759" stroke-width="2"/>
    <path d="M144 168 L147 171 L153 165" stroke="#34C759" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="162" y="165" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-decoration="line-through">Review PR #247</text>
    <text x="162" y="177" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#48484A">30m</text>

    <!-- Task 2 (pending, high priority) -->
    <rect x="135" y="190" width="155" height="32" rx="6" fill="#2C2C2E"/>
    <circle cx="148" cy="206" r="8" fill="none" stroke="#2BA5A8" stroke-width="2"/>
    <text x="162" y="203" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff">Write unit tests</text>
    <text x="162" y="215" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#FF9500">Due today</text>

    <!-- Task 3 (pending) -->
    <rect x="135" y="228" width="155" height="32" rx="6" fill="#2C2C2E"/>
    <circle cx="148" cy="244" r="8" fill="none" stroke="#48484A" stroke-width="1.5"/>
    <text x="162" y="241" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff">Update docs</text>
    <text x="162" y="253" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#48484A">1h</text>

    <!-- AI Recommendation Card (with glow) -->
    <g filter="url(#aiGlow)">
      <rect x="108" y="272" width="182" height="62" rx="10" fill="url(#aiCard)" stroke="#2BA5A8" stroke-width="1.5"/>
    </g>
    <text x="120" y="290" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#2BA5A8" font-weight="600">What should I do next?</text>
    <text x="120" y="308" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" font-weight="500">Write unit tests</text>
    <text x="120" y="324" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#6b7280">High priority • 45 min available</text>

    <!-- Sparkle icons for AI -->
    <g transform="translate(268, 278)">
      <path d="M6 0 L7.5 4.5 L12 6 L7.5 7.5 L6 12 L4.5 7.5 L0 6 L4.5 4.5 Z" fill="#2BA5A8" opacity="0.9"/>
    </g>
    <g transform="translate(258, 290)">
      <path d="M3 0 L3.75 2.25 L6 3 L3.75 3.75 L3 6 L2.25 3.75 L0 3 L2.25 2.25 Z" fill="#2BA5A8" opacity="0.6"/>
    </g>

    <!-- Bottom Tab Bar -->
    <rect x="100" y="345" width="200" height="45" fill="#1C1C1E"/>
    <line x1="100" y1="345" x2="300" y2="345" stroke="#3A3A3C" stroke-width="0.5"/>

    <!-- Tab: Today (active) -->
    <g transform="translate(125, 355)">
      <rect x="-5" y="-2" width="30" height="28" rx="6" fill="#2BA5A8" opacity="0.15"/>
      <circle cx="10" cy="8" r="5" fill="none" stroke="#2BA5A8" stroke-width="1.5"/>
      <path d="M10 5 L10 9 L12.5 9" stroke="#2BA5A8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="10" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#2BA5A8" text-anchor="middle">Today</text>
    </g>

    <!-- Tab: Calendar -->
    <g transform="translate(175, 355)">
      <rect x="2" y="2" width="14" height="12" rx="2" fill="none" stroke="#6b7280" stroke-width="1.2"/>
      <line x1="2" y1="6" x2="16" y2="6" stroke="#6b7280" stroke-width="1.2"/>
      <text x="9" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Calendar</text>
    </g>

    <!-- Tab: Lists -->
    <g transform="translate(225, 355)">
      <line x1="2" y1="4" x2="14" y2="4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="9" x2="14" y2="9" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="14" x2="10" y2="14" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
      <text x="8" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Lists</text>
    </g>

    <!-- Tab: Settings -->
    <g transform="translate(265, 355)">
      <circle cx="9" cy="9" r="6" fill="none" stroke="#6b7280" stroke-width="1.2"/>
      <circle cx="9" cy="9" r="2" fill="#6b7280"/>
      <text x="9" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Settings</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <rect x="170" y="398" width="60" height="4" rx="2" fill="#475569"/>
</svg>
