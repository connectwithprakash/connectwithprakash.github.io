<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="presentationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="businessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2BA5A8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#218A8D;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:0.1" />
    </linearGradient>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2BA5A8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="22" fill="#2BA5A8" text-anchor="middle" font-weight="600">Lazyflow Architecture</text>
  <text x="450" y="55" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Clean Architecture with MVVM Pattern</text>

  <!-- ==================== LAYER 1: PRESENTATION ==================== -->
  <rect x="100" y="75" width="500" height="85" rx="10" fill="url(#presentationGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="120" y="98" font-family="SF Mono, monospace" font-size="11" fill="#a78bfa" font-weight="600">PRESENTATION LAYER</text>
  <text x="120" y="113" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">SwiftUI Views, ViewModels, Navigation</text>

  <!-- Presentation components -->
  <rect x="120" y="125" width="90" height="25" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="165" y="142" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">TodayView</text>

  <rect x="220" y="125" width="90" height="25" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="265" y="142" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">CalendarView</text>

  <rect x="320" y="125" width="90" height="25" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="365" y="142" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">TaskEditor</text>

  <rect x="420" y="125" width="90" height="25" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="465" y="142" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">SettingsView</text>

  <rect x="520" y="125" width="65" height="25" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="552" y="142" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">...</text>

  <!-- Arrow down -->
  <path d="M350 165 L350 185" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== LAYER 2: BUSINESS LOGIC ==================== -->
  <rect x="100" y="195" width="500" height="85" rx="10" fill="url(#businessGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="218" font-family="SF Mono, monospace" font-size="11" fill="#fbbf24" font-weight="600">BUSINESS LOGIC LAYER</text>
  <text x="120" y="233" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">Priority Algorithm, Conflict Detection, Time Blocking</text>

  <!-- Business components -->
  <rect x="120" y="245" width="115" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="177" y="262" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">PriorityEngine</text>

  <rect x="245" y="245" width="115" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="302" y="262" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">ConflictDetector</text>

  <rect x="370" y="245" width="115" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="427" y="262" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">TimeBlocker</text>

  <rect x="495" y="245" width="90" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="262" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">Scheduler</text>

  <!-- Arrow down -->
  <path d="M350 285 L350 305" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== LAYER 3: SERVICE ==================== -->
  <rect x="100" y="315" width="500" height="85" rx="10" fill="url(#serviceGrad)" stroke="#2BA5A8" stroke-width="2"/>
  <text x="120" y="338" font-family="SF Mono, monospace" font-size="11" fill="#2BA5A8" font-weight="600">SERVICE LAYER</text>
  <text x="120" y="353" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">TaskService, CalendarService, AIService, SyncService</text>

  <!-- Service components -->
  <rect x="120" y="365" width="100" height="25" rx="4" fill="#1e293b" stroke="#2BA5A8" stroke-width="1"/>
  <text x="170" y="382" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">TaskService</text>

  <rect x="230" y="365" width="110" height="25" rx="4" fill="#1e293b" stroke="#2BA5A8" stroke-width="1"/>
  <text x="285" y="382" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">CalendarService</text>

  <rect x="350" y="365" width="80" height="25" rx="4" fill="#1e293b" stroke="#2BA5A8" stroke-width="1"/>
  <text x="390" y="382" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">AIService</text>

  <rect x="440" y="365" width="90" height="25" rx="4" fill="#1e293b" stroke="#2BA5A8" stroke-width="1"/>
  <text x="485" y="382" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">SyncService</text>

  <rect x="540" y="365" width="50" height="25" rx="4" fill="#1e293b" stroke="#2BA5A8" stroke-width="1"/>
  <text x="565" y="382" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">...</text>

  <!-- Arrow down -->
  <path d="M350 405 L350 425" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== LAYER 4: DATA & INFRASTRUCTURE ==================== -->
  <rect x="100" y="435" width="500" height="85" rx="10" fill="url(#dataGrad)" stroke="#10b981" stroke-width="2"/>
