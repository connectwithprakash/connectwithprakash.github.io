  <rect x="120" y="485" width="85" height="25" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="162" y="502" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">Core Data</text>

  <rect x="215" y="485" width="85" height="25" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="257" y="502" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">CloudKit</text>

  <rect x="310" y="485" width="85" height="25" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="352" y="502" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">EventKit</text>

  <rect x="405" y="485" width="95" height="25" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="452" y="502" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">WatchConnect</text>

  <rect x="510" y="485" width="75" height="25" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="547" y="502" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">UserDef</text>

  <!-- ==================== AI PROVIDERS (Right Side) ==================== -->
  <rect x="650" y="195" width="220" height="205" rx="10" fill="url(#aiGrad)" stroke="#ec4899" stroke-width="2"/>
  <text x="760" y="220" font-family="SF Mono, monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="600">AI PROVIDERS</text>
  <text x="760" y="238" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">User brings own API keys</text>

  <!-- AI Provider 1: Apple Intelligence -->
  <rect x="670" y="255" width="180" height="40" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="760" y="275" font-family="SF Mono, monospace" font-size="10" fill="#f472b6" text-anchor="middle" font-weight="500">Apple Intelligence</text>
  <text x="760" y="290" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">On-device, Private</text>

  <!-- AI Provider 2: Claude API -->
  <rect x="670" y="305" width="180" height="40" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="760" y="325" font-family="SF Mono, monospace" font-size="10" fill="#f472b6" text-anchor="middle" font-weight="500">Claude API</text>
  <text x="760" y="340" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">Anthropic</text>

  <!-- AI Provider 3: OpenAI API -->
  <rect x="670" y="355" width="180" height="40" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="760" y="375" font-family="SF Mono, monospace" font-size="10" fill="#f472b6" text-anchor="middle" font-weight="500">OpenAI API</text>
  <text x="760" y="390" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">GPT Models</text>

  <!-- Arrow from AIService to AI Providers -->
  <line x1="390" y1="365" x2="390" y2="340" stroke="#2BA5A8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="390" y1="340" x2="645" y2="340" stroke="#2BA5A8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowTeal)"/>
  <text x="520" y="333" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">API Calls</text>

  <!-- ==================== EXTENSIONS (Right Side Bottom) ==================== -->
  <rect x="650" y="435" width="220" height="85" rx="10" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="760" y="458" font-family="SF Mono, monospace" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="600">EXTENSIONS</text>

  <rect x="670" y="470" width="85" height="35" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="712" y="487" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa" text-anchor="middle">Widgets</text>
  <text x="712" y="500" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">WidgetKit</text>

  <rect x="765" y="470" width="85" height="35" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="807" y="487" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa" text-anchor="middle">Watch</text>
  <text x="807" y="500" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">WatchOS App</text>

  <!-- ==================== PLATFORMS (Top Right) ==================== -->
  <rect x="650" y="75" width="220" height="85" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="760" y="98" font-family="SF Mono, monospace" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">PLATFORMS</text>

  <rect x="670" y="110" width="55" height="35" rx="4" fill="#1e293b" stroke="#6b7280" stroke-width="1"/>
  <text x="697" y="127" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">iOS</text>
  <text x="697" y="140" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">17+</text>

  <rect x="735" y="110" width="55" height="35" rx="4" fill="#1e293b" stroke="#6b7280" stroke-width="1"/>
  <text x="762" y="127" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">iPadOS</text>
  <text x="762" y="140" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">17+</text>

  <rect x="800" y="110" width="55" height="35" rx="4" fill="#1e293b" stroke="#6b7280" stroke-width="1"/>
  <text x="827" y="127" font-family="SF Mono, monospace" font-size="9" fill="#e0e0e0" text-anchor="middle">watchOS</text>
  <text x="827" y="140" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">10+</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="100" y="545" width="530" height="40" rx="6" fill="#1e293b" opacity="0.5"/>
  <text x="120" y="568" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">Architecture:</text>
  <text x="200" y="568" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa">MVVM</text>
  <text x="260" y="568" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">Data Flow:</text>
  <text x="335" y="568" font-family="SF Mono, monospace" font-size="9" fill="#2BA5A8">Combine</text>
  <text x="400" y="568" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">Language:</text>
  <text x="470" y="568" font-family="SF Mono, monospace" font-size="9" fill="#f59e0b">Swift 5.9</text>
  <text x="540" y="568" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280">UI:</text>
  <text x="565" y="568" font-family="SF Mono, monospace" font-size="9" fill="#10b981">SwiftUI</text>
</svg>
