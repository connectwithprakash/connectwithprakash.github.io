    <text x="602" y="168" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#2BA5A8" text-anchor="end">Jan 8</text>

    <!-- Time labels -->
    <text x="452" y="205" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">9 AM</text>
    <text x="452" y="260" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">10 AM</text>
    <text x="452" y="315" font-family="SF Mono, monospace" font-size="8" fill="#6b7280">11 AM</text>

    <!-- Calendar event -->
    <rect x="478" y="192" width="130" height="38" rx="6" fill="url(#calendarEvent)"/>
    <text x="486" y="208" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="500">Team Standup</text>
    <text x="486" y="222" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">9:00 - 9:30 AM</text>

    <!-- Task 1 (completed) -->
    <rect x="478" y="238" width="130" height="30" rx="6" fill="#2C2C2E"/>
    <circle cx="490" cy="253" r="7" fill="none" stroke="#34C759" stroke-width="1.5"/>
    <path d="M486 253 L489 256 L494 250" stroke="#34C759" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="502" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-decoration="line-through">Review PR #247</text>
    <text x="502" y="262" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#48484A">30m</text>

