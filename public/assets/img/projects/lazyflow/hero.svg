  <!-- Camera -->
  <circle cx="860" cy="90" r="4" fill="#1f2937"/>

  <!-- iPad screen -->
  <g clip-path="url(#ipadScreen)">
    <rect x="680" y="95" width="360" height="270" fill="#1F2121"/>

    <!-- Split view: Calendar on left, Tasks on right -->

    <!-- Left panel: Calendar week view -->
    <rect x="680" y="95" width="180" height="270" fill="#1a1a1e"/>

    <!-- Calendar header -->
    <rect x="680" y="95" width="180" height="30" fill="#2C2C2E"/>
    <text x="770" y="115" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">January 2026</text>

