    <line x1="517" y1="454" x2="527" y2="454" stroke="#6b7280" stroke-width="1"/>
    <text x="522" y="472" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Calendar</text>

    <!-- Tab: Lists -->
    <line x1="560" y1="452" x2="570" y2="452" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="560" y1="457" x2="570" y2="457" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="560" y1="462" x2="567" y2="462" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <text x="565" y="472" font-family="SF Pro Display, -apple-system, sans-serif" font-size="7" fill="#6b7280" text-anchor="middle">Lists</text>

    <!-- Home indicator -->
    <rect x="505" y="478" width="50" height="4" rx="2" fill="#48484A"/>
