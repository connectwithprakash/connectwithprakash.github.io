    <text x="752" y="156" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">8</text>
    <text x="777" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">9</text>
    <text x="802" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">10</text>
    <text x="827" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">11</text>
