<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 405">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="405" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="425" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="600">3-Agent Annotation Workflow</text>

  <!-- Input: Sampled Match (centered at y=200) -->
  <rect x="40" y="145" width="100" height="110" rx="8" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="90" y="175" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="600">INPUT</text>
  <text x="90" y="198" font-family="SF Pro Display, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">Sampled</text>
  <text x="90" y="213" font-family="SF Pro Display, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">Match</text>
  <text x="90" y="238" font-family="SF Mono, monospace" font-size="8" fill="#6b7280" text-anchor="middle">SPD + Catalog</text>

  <!-- Fork arrows from input (x=140) to Human1 and LLM -->
  <path d="M140 180 L165 180 L165 115 L205 115" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M140 220 L165 220 L165 240 L225 240" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Human Annotator 1 (top path) - center at y=115 -->
  <rect x="205" y="80" width="110" height="70" rx="8" fill="url(#humanGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="105" font-family="SF Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="600">HUMAN 1</text>
  <text x="260" y="125" font-family="SF Pro Display, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">Annotator</text>
  <text x="260" y="142" font-family="SF Mono, monospace" font-size="9" fill="#6b7280" text-anchor="middle">Label: 0-4</text>

  <!-- 3-Agent LLM Container (bottom path) - aligned with Human 1 at x=205 -->
  <rect x="205" y="185" width="280" height="95" rx="8" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="345" y="202" font-family="SF Mono, monospace" font-size="9" fill="#6366f1" text-anchor="middle">3-AGENT LLM</text>

  <!-- Agent 1: Normalize -->
  <rect x="225" y="212" width="70" height="55" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="260" y="232" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 1</text>
  <text x="260" y="250" font-family="SF Pro Display, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Normalize</text>

  <!-- Arrow 1->2 -->
  <path d="M295 240 L305 240" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 2: Brand -->
  <rect x="305" y="212" width="70" height="55" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="340" y="232" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 2</text>
  <text x="340" y="250" font-family="SF Pro Display, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Brand</text>

  <!-- Arrow 2->3 -->
  <path d="M375 240 L385 240" stroke="#8b5cf6" stroke-width="1.5" fill="none"/>

  <!-- Agent 3: Classify -->
  <rect x="385" y="212" width="70" height="55" rx="6" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="232" font-family="SF Mono, monospace" font-size="8" fill="#a78bfa" text-anchor="middle">AGENT 3</text>
  <text x="420" y="250" font-family="SF Pro Display, sans-serif" font-size="9" fill="#e0e0e0" text-anchor="middle">Classify</text>

  <!-- Arrow from Human1 to comparison (from x=315 to diamond left at x=555, y=190) -->
  <path d="M315 115 L510 115 L510 175 L545 175" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- Arrow from LLM to comparison (from x=455 to diamond left at x=555, y=190) -->
  <path d="M455 240 L510 240 L510 205 L545 205" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Comparison Diamond - left point at x=555, center at x=595 -->
  <polygon points="555,190 595,155 635,190 595,225" fill="url(#agentGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="595" y="186" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Agree?</text>
  <text x="595" y="200" font-family="SF Mono, monospace" font-size="9" fill="#a78bfa" text-anchor="middle">H1=LLM</text>

  <!-- Yes path (80%) - from diamond TOP vertex (595, 155) to Accept box -->
  <path d="M595 155 L595 110 L680 110" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="635" y="102" font-family="SF Mono, monospace" font-size="9" fill="#10b981" text-anchor="middle">80%</text>

  <!-- Output: Accept Label - positioned closer to diamond -->
  <rect x="690" y="70" width="100" height="80" rx="8" fill="url(#outputGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="740" y="95" font-family="SF Mono, monospace" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">ACCEPT</text>
  <text x="740" y="115" font-family="SF Pro Display, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">Label</text>
  <text x="740" y="135" font-family="SF Pro Display, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Confirmed</text>

  <!-- No path (20%) - from diamond BOTTOM vertex (595, 225) to Human2 -->
  <path d="M595 225 L595 270 L680 270" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="635" y="252" font-family="SF Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">20%</text>

  <!-- Human 2 Review - positioned closer to diamond -->
  <rect x="690" y="235" width="100" height="70" rx="8" fill="url(#humanGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="260" font-family="SF Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="600">HUMAN 2</text>
  <text x="740" y="278" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Reviews</text>
  <text x="740" y="295" font-family="SF Pro Display, sans-serif" font-size="10" fill="#e0e0e0" text-anchor="middle">Disagreement</text>

  <!-- Stats bar - moved up -->
  <rect x="150" y="330" width="550" height="35" rx="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <text x="260" y="352" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">80%+ LLM Accuracy</text>
  <text x="425" y="352" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">40% Workload Reduction</text>
  <text x="590" y="352" font-family="SF Mono, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">Quality Maintained</text>

</svg>
