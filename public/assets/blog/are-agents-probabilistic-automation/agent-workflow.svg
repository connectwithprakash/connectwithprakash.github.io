<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img">
  <defs>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#252538"/>
      <stop offset="100%" stop-color="#343456"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#818cf8"/>
    </marker>
    <style>
      .bg { fill: #111827; stroke: rgba(129,140,248,.35); stroke-width: 1; }
      .box { fill: url(#node); stroke: #818cf8; stroke-width: 1.5; rx: 15; }
      .safe { stroke: #22c55e; }
      .risk { stroke: #f59e0b; }
      .danger { stroke: #ef4444; }
      .decision { fill: #1f2937; stroke: #a78bfa; stroke-width: 1.5; }
      .title { fill: #f8fafc; font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; }
      .text { fill: #e2e8f0; font: 650 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #cbd5e1; font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #94a3b8; font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .line { stroke: #818cf8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-safe { stroke: #22c55e; }
      .line-risk { stroke: #f59e0b; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="718" height="518" rx="20"/>
<text class="title" x="360" y="38" text-anchor="middle">A safer workflow separates learning from execution</text>
<rect class="box safe" x="45" y="88" width="125" height="82" rx="15"/>
<text class="text" x="107.5" y="132" text-anchor="middle">Learn</text>
<text class="muted" x="107.5" y="154" text-anchor="middle">inspect system</text>
<rect class="box safe" x="200" y="88" width="125" height="82" rx="15"/>
<text class="text" x="262.5" y="132" text-anchor="middle">Specify</text>
<text class="muted" x="262.5" y="154" text-anchor="middle">make intent explicit</text>
<rect class="box " x="355" y="88" width="125" height="82" rx="15"/>
<text class="text" x="417.5" y="132" text-anchor="middle">Plan</text>
<text class="muted" x="417.5" y="154" text-anchor="middle">bound the change</text>
<rect class="box " x="510" y="88" width="125" height="82" rx="15"/>
<text class="text" x="572.5" y="132" text-anchor="middle">Execute</text>
<text class="muted" x="572.5" y="154" text-anchor="middle">edit and check</text>
<path class="line line-safe" d="M170 129 L200 129"/>
<path class="line line-safe" d="M325 129 L355 129"/>
<path class="line line-safe" d="M480 129 L510 129"/>
<path class="line" d="M572 170 L572 218"/>
<rect class="box safe" x="470" y="222" width="205" height="78" rx="15"/>
<text class="text" x="572.5" y="266" text-anchor="middle">Verify</text>
<text class="muted" x="572.5" y="284" text-anchor="middle">tests, diffs, logs</text>
<path class="line" d="M572 300 L572 344"/>
<rect class="box decision" x="435" y="348" width="275" height="78" rx="15"/>
<text class="text" x="572.5" y="392" text-anchor="middle">Side-effect boundary?</text>
<text class="muted" x="572.5" y="410" text-anchor="middle">deploy, delete, publish, migrate</text>
<rect class="box safe" x="145" y="348" width="135" height="78" rx="15"/>
<text class="text" x="212.5" y="392" text-anchor="middle">Continue</text>
<text class="muted" x="212.5" y="410" text-anchor="middle">low blast radius</text>
<path class="line line-safe" d="M435 386 L280 386"/>
<path class="line line-risk" d="M572 426 C572 465 438 465 438 426"/>
<text class="small" x="438" y="482" text-anchor="middle">If yes: dry run or explicit approval before acting</text>
<path class="line" d="M212 426 C150 486 95 220 108 170"/>
</svg>