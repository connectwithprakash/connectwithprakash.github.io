<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
  <defs>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#24243a"/>
      <stop offset="100%" stop-color="#323252"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#8b96ff"/>
    </marker>
    <style>
      .bg { fill: #0f1724; stroke: rgba(129,140,248,.38); stroke-width: 1.5; }
      .box { fill: url(#node); stroke: #818cf8; stroke-width: 2; }
      .safe { stroke: #22c55e; }
      .risk { stroke: #f59e0b; }
      .danger { stroke: #ff4d4d; }
      .decision { fill: #182133; stroke: #a78bfa; stroke-width: 2; }
      .title { fill: #f8fafc; font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; }
      .text { fill: #eef2ff; font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #d3d9e8; font: 600 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #aeb7ca; font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .line { stroke: #8b96ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-safe { stroke: #22c55e; }
      .line-risk { stroke: #f59e0b; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="1198" height="648" rx="28"/>
<text class="title" x="600" y="64" text-anchor="middle"><tspan x="600" dy="0">A safer workflow separates learning from execution</tspan></text>
<rect class="box safe" x="70" y="135" width="160" height="105" rx="18"/>
<text class="text" x="150.0" y="194.5" text-anchor="middle"><tspan x="150.0" dy="0">Learn</tspan></text>
<text class="muted" x="150.0" y="220" text-anchor="middle"><tspan x="150.0" dy="0">read, inspect</tspan></text>
<rect class="box safe" x="300" y="135" width="160" height="105" rx="18"/>
<text class="text" x="380.0" y="194.5" text-anchor="middle"><tspan x="380.0" dy="0">Specify</tspan></text>
<text class="muted" x="380.0" y="220" text-anchor="middle"><tspan x="380.0" dy="0">make intent explicit</tspan></text>
<rect class="box" x="530" y="135" width="160" height="105" rx="18"/>
<text class="text" x="610.0" y="194.5" text-anchor="middle"><tspan x="610.0" dy="0">Plan</tspan></text>
<text class="muted" x="610.0" y="220" text-anchor="middle"><tspan x="610.0" dy="0">bound the change</tspan></text>
<rect class="box" x="760" y="135" width="160" height="105" rx="18"/>
<text class="text" x="840.0" y="194.5" text-anchor="middle"><tspan x="840.0" dy="0">Execute</tspan></text>
<text class="muted" x="840.0" y="220" text-anchor="middle"><tspan x="840.0" dy="0">edit and check</tspan></text>
<rect class="box safe" x="990" y="135" width="160" height="105" rx="18"/>
<text class="text" x="1070.0" y="194.5" text-anchor="middle"><tspan x="1070.0" dy="0">Verify</tspan></text>
<text class="muted" x="1070.0" y="220" text-anchor="middle"><tspan x="1070.0" dy="0">tests, diffs</tspan></text>
<path class="line line-safe" d="M230 188 L300 188"/>
<path class="line line-safe" d="M460 188 L530 188"/>
<path class="line line-safe" d="M690 188 L760 188"/>
<path class="line line-safe" d="M920 188 L990 188"/>
<path class="line" d="M1070 240 C1070 295 930 310 825 330"/>
<rect class="box decision" x="690" y="335" width="270" height="95" rx="18"/>
<text class="text" x="825.0" y="377.0" text-anchor="middle"><tspan x="825.0" dy="0">Side-effect</tspan><tspan x="825.0" dy="25">boundary?</tspan></text>
<text class="muted" x="825.0" y="410" text-anchor="middle"><tspan x="825.0" dy="0">deploy, delete, publish</tspan></text>
<rect class="box safe" x="320" y="335" width="200" height="95" rx="18"/>
<text class="text" x="420.0" y="389.5" text-anchor="middle"><tspan x="420.0" dy="0">Continue</tspan></text>
<text class="muted" x="420.0" y="410" text-anchor="middle"><tspan x="420.0" dy="0">low blast radius</tspan></text>
<rect class="box danger" x="690" y="500" width="270" height="95" rx="18"/>
<text class="text" x="825.0" y="542.0" text-anchor="middle"><tspan x="825.0" dy="0">Dry run or</tspan><tspan x="825.0" dy="25">explicit approval</tspan></text>
<text class="muted" x="825.0" y="575" text-anchor="middle"><tspan x="825.0" dy="0">then act</tspan></text>
<path class="line line-safe" d="M690 382 L520 382"/>
<path class="line line-risk" d="M825 430 L825 500"/>
<path class="line" d="M420 430 C260 535 130 340 150 240"/>
</svg>